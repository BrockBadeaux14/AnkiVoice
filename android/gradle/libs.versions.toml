# Every AnkiVoice Android pin lives here. android/README.md lists them with their
# evidence; change both together.

[versions]
# Toolchain and SDK levels: AV-022's baseline, validated by the AV-004/AV-005 probes.
agp = "9.1.0"
compileSdk = "36"
targetSdk = "35"
minSdk = "33"
buildTools = "36.0.0"
java = "17"

# Left open by AV-022 and pinned by AV-041.
kotlin = "2.4.20"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
junit = "6.1.3"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
