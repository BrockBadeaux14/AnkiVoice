name: VoiceQA fixtures

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-fixtures.txt
      - run: python -m pip install -r requirements-fixtures.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python tools/av006-probe/validate_evidence.py
      # AV-017: the corpus table, the split discipline and the evidence guard.
      - run: python tools/av017-qa/validate.py
      # AV-043: the paid pin, the tuning-only spike evidence and the disclosure.
      - run: python tools/av043-qa/validate.py
      # AV-044: every recorded discovery attempt is internally consistent.
      - run: python tools/av044-qa/validate.py
      # AV-019: every live review was written from an explicit confirmation, and the two
      # cases that must not write left the collection alone.
      - run: python tools/av019-qa/validate.py
      # AV-026: every live study turn is judged from the collection's own revlog and the
      # controller's evidence export, and no-write turns left the card alone.
      - run: python tools/av026-qa/validate.py
