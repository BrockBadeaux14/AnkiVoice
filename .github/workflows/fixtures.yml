name: VoiceQA fixtures

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-fixtures.txt
      - run: python -m pip install -r requirements-fixtures.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python tools/av006-probe/validate_evidence.py
