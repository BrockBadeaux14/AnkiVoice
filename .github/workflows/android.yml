name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Also validates the checked-in Gradle wrapper against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the pinned Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"'
      - run: ./gradlew --console=plain checkModuleBoundaries :core:test assembleDebug
      # assembleDebugAndroidTest keeps the AV-024 and AV-025 live harnesses compiling; the
      # runs themselves need an emulator and an operator, so they stay out of CI.
      - run: ./gradlew --console=plain :ankidroid:testDebugUnitTest :provider:testDebugUnitTest :speech:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-reports
          path: android/core/build/reports/tests/test
          if-no-files-found: ignore
